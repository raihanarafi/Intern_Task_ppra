<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPRA - Internship Task</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header-container"></div>

    <aside class="social-sidebar">
        <a href="#" class="social-icon youtube" title="YouTube"><i class="fab fa-youtube"></i> <span>YouTube</span></a>
        <a href="#" class="social-icon twitter" title="Twitter"><i class="fab fa-twitter"></i> <span>Twitter</span></a>
        <a href="#" class="social-icon linkedin" title="LinkedIn"><i class="fab fa-linkedin-in"></i> <span>LinkedIn</span></a>
        <a href="#" class="social-icon facebook" title="Facebook"><i class="fab fa-facebook-f"></i> <span>Facebook</span></a>
    </aside>

    <main class="full-width-layout" id="page-content-wrapper">
    </main>

    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // 1. Fetch and inject the footer HTML file
            fetch("footer.html")
                .then(response => {
                    if (!response.ok) throw new Error("Error loading footer component.");
                    return response.text();
                })
                .then(htmlMarkup => {
                    document.getElementById("footer-placeholder").innerHTML = htmlMarkup;
                    
                    // 2. Fetch and inject the unique page content (Home Page)
                    return fetch("home.html");
                })
                .then(response => {
                    if (!response.ok) throw new Error("Error loading home content page.");
                    return response.text();
                })
                .then(homeMarkup => {
                    document.getElementById("page-content-wrapper").innerHTML = homeMarkup;

                    // 3. Initialize dynamic layout tracking
                    setupScrollVisibilityObservers();
                })
                .catch(err => console.error("Dynamic layout loader encounter:", err));
        });

        function setupScrollVisibilityObservers() {
            const sidebar = document.querySelector('.social-sidebar');
            const header = document.getElementById('header-container');
            
            const procurementHeaderSection = document.querySelector('.info-section-header');
            const vendorSection = document.querySelector('.vendor-registration-section');
            const footerPlaceholder = document.getElementById('footer-placeholder');

            // Track the last scroll position to calculate scroll direction
            let lastScrollTop = 0;

            window.addEventListener('scroll', function() {
                const currentScroll = window.scrollY || window.pageYOffset;

                // --- SMART SIDEBAR DIRECTION LOGIC ---
                if (sidebar) {
                    if (currentScroll <= 50) {
                        // Force show if user is completely at the top of the page
                        sidebar.classList.remove('sidebar-hidden');
                    } else if (currentScroll > lastScrollTop) {
                        // User is scrolling DOWN -> Hide the sidebar immediately
                        sidebar.classList.add('sidebar-hidden');
                    } else {
                        // User is scrolling UP -> Slowly bring it back into view
                        sidebar.classList.remove('sidebar-hidden');
                    }
                }

                // --- HEADER VISIBILITY MAINTENANCE ---
                if (header) {
                    const procRect = procurementHeaderSection ? procurementHeaderSection.getBoundingClientRect() : null;
                    const vendRect = vendorSection ? vendorSection.getBoundingClientRect() : null;
                    const footRect = footerPlaceholder ? footerPlaceholder.getBoundingClientRect() : null;
                    
                    const procVisible = procRect && procRect.top < window.innerHeight && procRect.bottom > 0;
                    const vendVisible = vendRect && vendRect.top < window.innerHeight && vendRect.bottom > 0;
                    const footVisible = footRect && footRect.top < window.innerHeight && footRect.bottom > 0;

                    if (procVisible || vendVisible || footVisible) {
                        header.classList.add('header-hidden');
                    } else {
                        header.classList.remove('header-hidden');
                    }
                }

                // Update the position value for the next scroll loop frame evaluation
                lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
            }, { passive: true });
        }
    </script>
</body>
</html>
